<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>손실 없는 투자 원칙 VIP (포커스)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Montserrat:wght@900&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; 
            background: #00020a; color: #f8fafc; overflow-x: hidden; word-break: keep-all;
        }

        /* [움직이는 별빛 배경] */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px);
            background-size: 550px 550px; animation: backgroundStarMove 60s linear infinite;
            opacity: 0.2; z-index: 0;
        }
        @keyframes backgroundStarMove { from { background-position: 0 0; } to { background-position: -1000px 500px; } }

        /* [움직이는 FOCUS 로고] */
        .logo-wrapper { padding: 60px 0 20px; text-align: center; position: relative; z-index: 10; }
        .brand-logo { display: inline-flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; }
        .logo-text { font-size: 42px; letter-spacing: 0.15em; color: #fff; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); margin-right: 12px; font-weight: 900; }
        .logo-symbol {
            width: 38px; height: 38px; border: 4px solid #fbbf24; border-radius: 8px;
            position: relative; transform: rotate(45deg); animation: symbol-rotate 4s infinite;
        }
        @keyframes symbol-rotate { 0% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }

        /* [컨텐츠 디자인] */
        header { text-align: center; padding: 10px 20px 100px; position: relative; z-index: 10; }
        h1 { font-size: 36px; font-weight: 900; color: #fff; }
        .gold { color: #fbbf24; }
        .container { max-width: 500px; margin: -70px auto 60px; position: relative; z-index: 10; padding: 0 20px; }
        
        .benefit-box { 
            background: rgba(251, 191, 36, 0.05); padding: 30px 15px; border-radius: 24px; text-align: center; 
            border: 2px solid #fbbf24; margin-bottom: 30px; backdrop-filter: blur(10px);
        }

        /* [네이버 폼 섹션 - 배경 매칭] */
        .form-section { margin-top: 50px; text-align: center; }
        .form-outer-box {
            width: 100%; max-width: 500px; margin: 20px auto;
            /* 네이버 폼의 흰색과 검은 배경을 이어주는 그라데이션 테두리 */
            background: linear-gradient(180deg, rgba(251,191,36,0.3) 0%, #ffffff 15%);
            border-radius: 25px; padding: 8px; box-sizing: border-box;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
        }
        .form-inner-frame {
            border-radius: 18px; overflow: hidden; background: #fff;
            height: 850px; /* 폼이 잘리면 이 숫자를 키우세요 */
        }
    </style>
</head>
<body>

<header>
    <div class="logo-wrapper">
        <div class="brand-logo">
            <span class="logo-text">FOCUS</span>
            <div class="logo-symbol"></div>
        </div>
    </div>
    <h1>손실 없는 투자 원칙<br><span class="gold">VIP (포커스)</span></h1>
</header>

<div class="container">
    <div class="benefit-box">
        <div style="display: flex; justify-content: space-around;">
            <div><small>초기 매입금 지원</small><br><b class="gold" style="font-size:20px;">20% 즉시지급</b></div>
            <div><small>해외선물 수수료</small><br><b class="gold" style="font-size:20px;">$2.0 최저가</b></div>
        </div>
    </div>

    <div class="form-section">
        <div style="margin-bottom: 25px;">
            <p style="color: #64748b; font-size: 13px; margin-bottom: 8px;">TOTAL VISITORS</p>
            <div style="display: inline-block; padding: 8px 15px; border: 1px solid #d4af37; background: #000; border-radius: 4px;">
                <span id="visit-number" style="color: #d4af37; font-size: 20px; font-weight: bold;">1,052</span>
            </div>
        </div>

        <h2 style="font-size: 20px; color: #fbbf24;">VIP 컨설팅 실시간 신청</h2>
        
        <div class="form-outer-box">
            <div class="form-inner-frame">
                <iframe 
                    src="https://form.naver.com/me/50BAV2eP/fill" 
                    width="100%" height="100%" frameborder="0">
                    로드 중...
                </iframe>
            </div>
        </div>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 15px;">* 모든 정보는 암호화되어 안전하게 처리됩니다.</p>
    </div>
</div>

<script>
    function updateCounter() {
        const hasVisited = localStorage.getItem('focus_real_visit');
        let count = parseInt(localStorage.getItem('focus_total_count')) || 1052;
        if (!hasVisited) {
            count += 1;
            localStorage.setItem('focus_total_count', count);
            localStorage.setItem('focus_real_visit', Date.now());
        }
        document.getElementById('visit-number').innerText = count.toLocaleString();
    }
    updateCounter();
</script>

</body>
</html>
