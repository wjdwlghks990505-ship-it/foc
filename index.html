<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>손실 없는 투자 원칙 VIP (포커스)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Montserrat:wght@900&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; 
            background: #00020a; color: #f8fafc; overflow-x: hidden; word-break: keep-all;
        }

        /* [움직이는 배경] */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,.15) 1.5px, transparent 2px);
            background-size: 400px 400px; animation: backgroundStarMove 60s linear infinite;
            opacity: 0.2; z-index: 0;
        }
        @keyframes backgroundStarMove { from { background-position: 0 0; } to { background-position: -1000px 500px; } }

        /* [상단 FOCUS 로고 애니메이션] */
        .logo-wrapper { padding: 60px 0 20px; text-align: center; position: relative; z-index: 10; }
        .brand-logo { display: inline-flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; }
        .logo-text { font-size: 42px; letter-spacing: 0.15em; color: #fff; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); margin-right: 12px; font-weight: 900; }
        .logo-symbol {
            width: 38px; height: 38px; border: 4px solid #fbbf24; border-radius: 8px;
            position: relative; transform: rotate(45deg); animation: symbol-rotate 4s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes symbol-rotate { 0% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }

        /* [컨텐츠 영역] */
        header { text-align: center; padding: 10px 20px 80px; position: relative; z-index: 10; }
        h1 { font-size: 34px; font-weight: 900; color: #fff; line-height: 1.3; }
        .gold { color: #fbbf24; }
        .container { max-width: 500px; margin: -50px auto 0; position: relative; z-index: 10; padding: 0 20px; }
        
        /* 혜택 박스 */
        .benefit-box { 
            background: rgba(251, 191, 36, 0.05); padding: 25px 15px; border-radius: 20px; text-align: center; 
            border: 1.5px solid #fbbf24; margin-bottom: 40px; backdrop-filter: blur(10px);
        }

        /* [네이버 폼 연결 섹션] */
        .form-section { 
            margin-top: 20px; 
            /* 하단으로 갈수록 네이버 폼 배경색(#f0f0f0 계열)과 섞이도록 처리 */
            background: linear-gradient(180deg, transparent 0%, rgba(240, 242, 245, 1) 20%);
            margin-left: -20px; margin-right: -20px; padding: 60px 20px 40px;
            border-radius: 40px 40px 0 0;
        }

        .form-outer-box {
            width: 100%; max-width: 500px; margin: 0 auto;
            background: #ffffff; border-radius: 20px; padding: 5px; box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .form-inner-frame {
            border-radius: 15px; overflow: hidden; background: #fff;
            height: 950px; /* 네이버 폼 길이에 맞춰 충분히 확보 */
        }
    </style>
</head>
<body>

<header>
    <div class="logo-wrapper">
        <div class="brand-logo">
            <span class="logo-text">FOCUS</span>
            <div class="logo-symbol"></div>
        </div>
    </div>
    <h1>손실 없는 투자 원칙<br><span class="gold">VIP 컨설팅</span></h1>
</header>

<div class="container">
    <div class="benefit-box">
        <div style="display: flex; justify-content: space-around; align-items: center;">
            <div style="text-align: center;">
                <span style="font-size: 13px; color: #94a3b8;">초기 매입금</span><br>
                <b class="gold" style="font-size:19px;">20% 지원</b>
            </div>
            <div style="width: 1px; height: 30px; background: rgba(251,191,36,0.3);"></div>
            <div style="text-align: center;">
                <span style="font-size: 13px; color: #94a3b8;">해외선물 수수료</span><br>
                <b class="gold" style="font-size:19px;">$2.0 협의</b>
            </div>
        </div>
    </div>

    <div align="center" style="margin-bottom: 30px;">
        <p style="color: #64748b; font-size: 12px; margin-bottom: 8px; letter-spacing: 1px;">TOTAL VISITORS</p>
        <div style="display: inline-block; padding: 6px 16px; border: 1px solid #fbbf24; background: #000; border-radius: 4px;">
            <span style="color: #fbbf24; font-size: 18px; font-weight: bold;">LIVE <span id="visit-number">1,052</span></span>
        </div>
    </div>
</div>

<div class="form-section">
    <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="font-size: 22px; color: #1e293b; font-weight: 900; margin-bottom: 5px;">실시간 상담 신청</h2>
        <p style="color: #64748b; font-size: 14px;">상세 정보를 입력해 주시면 전문가가 연락드립니다.</p>
    </div>

    <div class="form-outer-box">
        <div class="form-inner-frame">
            <iframe 
                src="https://form.naver.com/me/50BAV2eP/fill" 
                width="100%" height="100%" frameborder="0">
                로드 중...
            </iframe>
        </div>
    </div>
    
    <div style="text-align: center; padding: 40px 0; color: #94a3b8; font-size: 12px;">
        ⓒ VIP FOCUS PRINCIPLE. All Rights Reserved.
    </div>
</div>

<script>
    function updateCounter() {
        const hasVisited = localStorage.getItem('focus_real_visit');
        let count = parseInt(localStorage.getItem('focus_total_count')) || 1052;
        if (!hasVisited) {
            count += 1;
            localStorage.setItem('focus_total_count', count);
            localStorage.setItem('focus_real_visit', Date.now());
        }
        document.getElementById('visit-number').innerText = count.toLocaleString();
    }
    updateCounter();
</script>

</body>
</html>
