<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>손실 없는 투자 원칙 VIP (포커스)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Montserrat:wght@900&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; 
            background: #00020a; color: #f8fafc; overflow-x: hidden; word-break: keep-all;
        }

        /* [움직이는 배경] */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,.1) 1.5px, transparent 2px);
            background-size: 400px 400px; animation: backgroundStarMove 60s linear infinite;
            opacity: 0.2; z-index: 0;
        }
        @keyframes backgroundStarMove { from { background-position: 0 0; } to { background-position: -1000px 500px; } }

        /* [FOCUS 로고 애니메이션] */
        .logo-wrapper { padding: 60px 0 20px; text-align: center; position: relative; z-index: 10; }
        .brand-logo { display: inline-flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; }
        .logo-text { font-size: 42px; letter-spacing: 0.15em; color: #fff; text-shadow: 0 0 10px rgba(251, 191, 36, 0.8); margin-right: 12px; font-weight: 900; }
        .logo-symbol {
            width: 38px; height: 38px; border: 4px solid #fbbf24; border-radius: 8px;
            position: relative; transform: rotate(45deg); animation: symbol-rotate 4s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes symbol-rotate { 0% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }

        header { text-align: center; padding: 10px 20px 80px; position: relative; z-index: 10; }
        h1 { font-size: 34px; font-weight: 900; color: #fff; line-height: 1.3; }
        .gold { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        
        .container { max-width: 500px; margin: -50px auto 0; position: relative; z-index: 10; padding: 0 20px; }
        
        /* [혜택 & 내용 박스] */
        .benefit-box { 
            background: rgba(251, 191, 36, 0.05); padding: 25px 15px; border-radius: 20px; text-align: center; 
            border: 2px solid #fbbf24; margin-bottom: 30px; backdrop-filter: blur(10px);
        }
        .info-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px; border-radius: 20px; margin-bottom: 40px; line-height: 1.8;
        }
        .point { color: #fbbf24; font-weight: 700; margin-right: 8px; }

        /* [네이버 폼 섹션 - 배경 유지] */
        .form-area { margin-top: 50px; text-align: center; }
        .form-wrap {
            background: #fff; border-radius: 25px; padding: 5px; box-sizing: border-box;
            border: 5px solid #fbbf24; box-shadow: 0 0 40px rgba(251, 191, 36, 0.3);
            overflow: hidden; margin-top: 20px;
        }
        .form-wrap iframe { width: 100%; height: 950px; display: block; }

        /* [카운터 최하단] */
        .footer-counter { padding: 60px 0 80px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div class="logo-wrapper">
        <div class="brand-logo">
            <span class="logo-text">FOCUS</span>
            <div class="logo-symbol"></div>
        </div>
    </div>
    <h1>손실 없는 투자 원칙<br><span class="gold">VIP 전용 컨설팅</span></h1>
</header>

<div class="container">
    <div class="benefit-box">
        <div style="display: flex; justify-content: space-around;">
            <div><span style="font-size:12px; opacity:0.8;">초기 매입금 지원</span><br><b class="gold" style="font-size:20px;">20% 즉시지급</b></div>
            <div style="width:1px; background:rgba(251,191,36,0.3);"></div>
            <div><span style="font-size:12px; opacity:0.8;">해외선물 수수료</span><br><b class="gold" style="font-size:20px;">$2.0 최저가</b></div>
        </div>
    </div>

    <div class="info-card">
        <div style="margin-bottom:15px;"><span class="point">✔</span> 상방/하방 구애받지 않는 양방향 타점</div>
        <div style="margin-bottom:15px;"><span class="point">✔</span> 수년간 검증된 포커스만의 독보적 분석</div>
        <div style="margin-bottom:15px;"><span class="point">✔</span> 실시간 시장 이슈 브리핑 및 대응 전략</div>
        <div><span class="point">✔</span> 초보자도 가능한 1:1 맞춤형 무료 교육</div>
    </div>

    <div class="form-area">
        <h2 style="font-size: 24px; font-weight: 900; color: #fff;">[실시간 상담 신청]</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-top: 10px;">정보 입력 즉시 전문가가 배정됩니다.</p>
        
        <div class="form-wrap">
            <iframe src="https://naver.me/50BAV2eP" frameborder="0">로드 중...</iframe>
        </div>
    </div>

    <div class="footer-counter">
        <p style="color: #64748b; font-size: 12px; margin-bottom: 12px; letter-spacing: 2px;">REAL-TIME TRAFFIC</p>
        <div style="display: inline-block; padding: 10px 25px; border: 2px solid #fbbf24; background: #000; border-radius: 5px;">
            <span style="color: #fbbf24; font-size: 22px; font-weight: bold; letter-spacing: 2px;">
                <span style="font-size: 14px; margin-right: 8px; opacity: 0.8;">● LIVE</span> 
                <span id="visit-number">1,052</span>
            </span>
        </div>
        <p style="margin-top: 50px; color: #475569; font-size: 11px;">ⓒ VIP FOCUS PRINCIPLE. All Rights Reserved.</p>
    </div>
</div>

<script>
    function updateCounter() {
        let count = parseInt(localStorage.getItem('focus_total_count')) || 1052;
        if (!localStorage.getItem('focus_real_visit')) {
            count += 1;
            localStorage.setItem('focus_total_count', count);
            localStorage.setItem('focus_real_visit', Date.now());
        }
        document.getElementById('visit-number').innerText = count.toLocaleString();
    }
    updateCounter();
</script>

</body>
</html>
