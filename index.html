<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>손실 없는 투자 원칙 VIP (포커스)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Montserrat:wght@900&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; 
            background: #00020a; color: #f8fafc; overflow-x: hidden; word-break: keep-all;
        }

        /* [FOCUS 로고 애니메이션] */
        .logo-wrapper { padding: 60px 0 20px; text-align: center; position: relative; z-index: 10; }
        .brand-logo { display: inline-flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; }
        .logo-text { font-size: 42px; letter-spacing: 0.15em; color: #fff; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); margin-right: 12px; font-weight: 900; }
        .logo-symbol {
            width: 38px; height: 38px; border: 4px solid #fbbf24; border-radius: 8px;
            position: relative; transform: rotate(45deg); animation: symbol-rotate 4s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes symbol-rotate { 0% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }

        header { text-align: center; padding: 10px 20px 80px; position: relative; z-index: 10; }
        h1 { font-size: 34px; font-weight: 900; color: #fff; line-height: 1.3; }
        .gold { color: #fbbf24; }
        .container { max-width: 500px; margin: -50px auto 0; position: relative; z-index: 10; padding: 0 20px; }
        
        .benefit-box { 
            background: rgba(251, 191, 36, 0.05); padding: 25px 15px; border-radius: 20px; text-align: center; 
            border: 1.5px solid #fbbf24; margin-bottom: 40px; backdrop-filter: blur(10px);
        }

        /* [네이버 폼 구역] */
        .form-section {
            background: #ffffff; border-radius: 30px 30px 0 0; margin: 20px -20px 0; padding: 40px 10px 0;
            box-shadow: 0 -10px 30px rgba(251, 191, 36, 0.2);
        }

        .form-holder {
            width: 100%; height: 900px; overflow: hidden; border-radius: 20px;
            -webkit-overflow-scrolling: touch;
        }

        /* [카운터 최하단] */
        .footer-counter {
            background: #ffffff; text-align: center; padding: 40px 0 60px;
            margin-left: -10px; margin-right: -10px; border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-wrapper">
        <div class="brand-logo">
            <span class="logo-text">FOCUS</span>
            <div class="logo-symbol"></div>
        </div>
    </div>
    <h1>손실 없는 투자 원칙<br><span class="gold">(VIP) 포커스</span></h1>
</header>

<div class="container">
    <div class="benefit-box">
        <div style="display: flex; justify-content: space-around; align-items: center;">
            <div style="text-align: center;">
                <span style="font-size: 12px; color: #94a3b8;">초기 매입금</span><br>
                <b class="gold" style="font-size:18px;">20% 지원</b>
            </div>
            <div style="width: 1px; height: 30px; background: rgba(251,191,36,0.3);"></div>
            <div style="text-align: center;">
                <span style="font-size: 12px; color: #94a3b8;">해외선물 수수료</span><br>
                <b class="gold" style="font-size:18px;">$2.0 최저가</b>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="font-size: 20px; color: #1e293b; font-weight: 900;">실시간 무료 상담 신청</h2>
        </div>

        <div class="form-holder">
            <iframe 
                src="https://naver.me/50BAV2eP" 
                width="100%" height="100%" frameborder="0">
                로드 중...
            </iframe>
        </div>

        <div class="footer-counter">
            <p style="color: #64748b; font-size: 12px; margin-bottom: 8px; font-weight: bold;">TOTAL VISITORS</p>
            <div style="display: inline-block; padding: 8px 20px; border: 2px solid #fbbf24; background: #000; border-radius: 4px;">
                <span style="color: #fbbf24; font-size: 18px; font-weight: bold;">LIVE <span id="visit-number">1,052</span></span>
            </div>
            <div style="margin-top: 30px; color: #94a3b8; font-size: 11px;">ⓒ VIP FOCUS PRINCIPLE. All Rights Reserved.</div>
        </div>
    </div>
</div>

<script>
    function updateCounter() {
        let count = parseInt(localStorage.getItem('focus_total_count')) || 1052;
        if (!localStorage.getItem('focus_real_visit')) {
            count += 1;
            localStorage.setItem('focus_total_count', count);
            localStorage.setItem('focus_real_visit', Date.now());
        }
        document.getElementById('visit-number').innerText = count.toLocaleString();
    }
    updateCounter();
</script>

</body>
</html>
