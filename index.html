<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP FOCUS PRINCIPLE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Montserrat:wght@900&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; 
            background: #fdfdfd; color: #1a1a1a; overflow-x: hidden; word-break: keep-all;
        }

        /* [상단 골드 파티클 배경] */
        .top-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 500px;
            background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            z-index: 0;
        }

        /* [움직이는 FOCUS 로고] */
        .logo-wrapper { padding: 50px 0 20px; text-align: center; position: relative; z-index: 10; }
        .brand-logo { display: inline-flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; }
        .logo-text { font-size: 38px; letter-spacing: 0.1em; color: #222; margin-right: 12px; font-weight: 900; }
        .logo-symbol {
            width: 30px; height: 30px; border: 4px solid #d4af37; border-radius: 6px;
            position: relative; transform: rotate(45deg); animation: symbol-rotate 4s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        @keyframes symbol-rotate { 0% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }

        header { text-align: center; padding: 0 20px 60px; position: relative; z-index: 10; }
        .tagline { color: #d4af37; font-weight: 700; font-size: 13px; letter-spacing: 3px; display: block; margin-bottom: 10px; }
        h1 { font-size: 32px; font-weight: 900; color: #111; line-height: 1.4; margin: 0; }
        .gold-txt { color: #b8860b; }

        .container { max-width: 550px; margin: 0 auto; position: relative; z-index: 10; padding: 0 20px; }

        /* [체크리스트 박스] */
        .info-card {
            background: #ffffff; border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 25px; border-radius: 20px; margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .point { font-size: 13px; color: #444; display: flex; align-items: center; font-weight: 500; }
        .point::before { content: '✔'; color: #d4af37; margin-right: 8px; font-weight: 900; }

        /* [지원금 박스] */
        .benefit-row {
            display: flex; gap: 15px; margin-bottom: 40px;
        }
        .benefit-item {
            flex: 1; background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #eee;
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .benefit-item b { color: #b8860b; font-size: 16px; display: block; margin-top: 5px; }

        /* [네이버 폼 - 골드 반짝이 테두리] */
        .form-section { position: relative; margin-top: 40px; padding-bottom: 50px; }
        .form-wrap {
            position: relative; background: #fff; border-radius: 25px; padding: 8px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            border: 2px solid #d4af37;
            animation: border-glow 2s infinite alternate;
        }
        @keyframes border-glow {
            from { box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); border-color: #d4af37; }
            to { box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); border-color: #f1c40f; }
        }

        .form-wrap iframe { width: 100%; height: 850px; border-radius: 18px; border: none; }

        /* [최하단 카운터] */
        .footer-counter { text-align: center; padding: 40px 0 60px; background: #fff; }
        .counter-box {
            display: inline-block; padding: 8px 25px; background: #f9f9f9; 
            border: 1px solid #ddd; border-radius: 30px; color: #666; font-weight: 700;
        }
        .live-dot { color: #d4af37; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="top-bg"></div>

<header>
    <div class="logo-wrapper">
        <div class="brand-logo">
            <span class="logo-text">FOCUS</span>
            <div class="logo-symbol"></div>
        </div>
    </div>
    <span class="tagline">PREMIUM INVESTMENT PRINCIPLE</span>
    <h1>손실 없는 투자 원칙<br><span class="gold-txt">VIP (포커스)</span></h1>
</header>

<div class="container">
    <div class="info-card">
        <div class="point">양방향 타점 실시간</div>
        <div class="point">1:1 맞춤형 교육</div>
        <div class="point">리스크 헷지 시스템</div>
        <div class="point">실시간 리딩 서비스</div>
        <div class="point">독보적 시장 분석</div>
        <div class="point">주간 분석 리포트</div>
        <div class="point">이슈 브리핑 제공</div>
        <div class="point">투자 커뮤니티 초대</div>
    </div>

    <div class="benefit-row">
        <div class="benefit-item">
            <small>초기 매입금 지원</small>
            <b>20% 즉시지급</b>
        </div>
        <div class="benefit-item">
            <small>해외선물 수수료</small>
            <b>$2.0 최저가</b>
        </div>
    </div>

    <div class="form-section">
        <div align="center" style="margin-bottom: 20px;">
            <strong style="font-size: 18px; letter-spacing: -0.5px;">VIP 컨설팅 무료 신청</strong>
        </div>
        <div class="form-wrap">
            <iframe src="https://naver.me/50BAV2eP" scrolling="no">로드 중...</iframe>
        </div>
    </div>
</div>

<div class="footer-counter">
    <p style="font-size: 12px; color: #999; margin-bottom: 10px;">TOTAL VISITORS</p>
    <div class="counter-box">
        <span class="live-dot">●</span> LIVE <span id="visit-number">1,053</span>
    </div>
    <p style="margin-top: 40px; font-size: 11px; color: #ccc;">© VIP FOCUS PRINCIPLE. All Rights Reserved.</p>
</div>

<script>
    function updateCounter() {
        let count = parseInt(localStorage.getItem('focus_total_count')) || 1053;
        if (!localStorage.getItem('focus_real_visit')) {
            count += 1;
            localStorage.setItem('focus_total_count', count);
            localStorage.setItem('focus_real_visit', Date.now());
        }
        document.getElementById('visit-number').innerText = count.toLocaleString();
    }
    updateCounter();
</script>

</body>
</html>
