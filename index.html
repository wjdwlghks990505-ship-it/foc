<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP FOCUS PRINCIPLE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Montserrat:wght@900&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; 
            background: #000; color: #fff; overflow-x: hidden; word-break: keep-all;
        }

        /* [움직이는 배경] */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,.1) 1.5px, transparent 2px);
            background-size: 400px 400px; animation: backgroundStarMove 60s linear infinite;
            opacity: 0.2; z-index: 0;
        }
        @keyframes backgroundStarMove { from { background-position: 0 0; } to { background-position: -1000px 500px; } }

        /* [FOCUS 로고 애니메이션] */
        .logo-wrapper { padding: 60px 0 20px; text-align: center; position: relative; z-index: 10; }
        .brand-logo { display: inline-flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; }
        .logo-text { font-size: 42px; letter-spacing: 0.15em; color: #fff; text-shadow: 0 0 10px rgba(251, 191, 36, 0.8); margin-right: 12px; font-weight: 900; }
        .logo-symbol {
            width: 38px; height: 38px; border: 4px solid #fbbf24; border-radius: 8px;
            position: relative; transform: rotate(45deg); animation: symbol-rotate 4s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes symbol-rotate { 0% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }

        header { text-align: center; padding: 0 20px 80px; position: relative; z-index: 10; }
        h1 { font-size: 34px; font-weight: 900; color: #fff; line-height: 1.3; margin: 0; }
        .gold-txt { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }

        .container { max-width: 500px; margin: -50px auto 0; position: relative; z-index: 10; padding: 0 20px; }

        /* [혜택 박스] */
        .benefit-row { 
            background: rgba(251, 191, 36, 0.05); padding: 25px 15px; border-radius: 20px; text-align: center; 
            border: 2px solid #fbbf24; margin-bottom: 30px; backdrop-filter: blur(10px);
            display: flex; justify-content: space-around;
        }
        .benefit-item span { font-size:12px; opacity:0.8; }
        .benefit-item b { color: #fbbf24; font-size:19px; display: block; margin-top: 5px; }

        /* [체크리스트 박스] */
        .info-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px; border-radius: 20px; margin-bottom: 40px; line-height: 1.8; font-size: 14px; color: #ccc;
        }
        .point::before { content: '✔'; color: #fbbf24; font-weight: 700; margin-right: 10px; }

        /* [신청서 섹션 - 움직이는 골드 테두리] */
        .form-section { margin-top: 50px; text-align: center; position: relative; }
        
        /* 반짝이 애니메이션을 위한 외부 컨테이너 */
        .form-wrap {
            position: relative; display: inline-block; width: 100%; max-width: 500px;
            padding: 15px; border-radius: 25px;
            
            /* 핵심: 골드 그라데이션 테두리 */
            background: linear-gradient(135deg, #fbbf24 0%, #d4af37 50%, #fbbf24 100%);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
            
            /* 테두리가 번쩍이며 돌아가는 애니메이션 */
            background-size: 200% 200%;
            animation: border-sparkle 3s infinite linear;
        }
        
        @keyframes border-sparkle {
            0% { background-position: 0% 50%; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
            50% { background-position: 100% 50%; box-shadow: 0 0 40px rgba(251, 191, 36, 0.6); }
            100% { background-position: 0% 50%; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
        }

        /* [움직이는 반짝이 입자 효과] */
        .form-wrap::after {
            content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            background: radial-gradient(circle at 10% 10%, rgba(251, 191, 36, 0.3) 1px, transparent 1px),
                        radial-gradient(circle at 90% 90%, rgba(251, 191, 36, 0.3) 1px, transparent 1px),
                        radial-gradient(circle at 50% 10%, rgba(251, 191, 36, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: sparkle-drift 4s infinite alternate;
            opacity: 0.6; pointer-events: none;
        }
        @keyframes sparkle drift {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.1); }
        }

        .form-wrap iframe {
            width: 100%; height: 950px; border-radius: 15px; border: none; background: #fff; display: block;
        }

        /* [최하단 카운터] */
        .footer-counter { padding: 60px 0 80px; text-align: center; position: relative; z-index: 10; }
        .counter-box {
            display: inline-block; padding: 10px 25px; border: 2px solid #fbbf24; 
            background: #000; border-radius: 5px; box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }
    }
    </style>
</head>
<body>

<header>
    <div class="logo-wrapper">
        <div class="brand-logo">
            <span class="logo-text">FOCUS</span>
            <div class="logo-symbol"></div>
        </div>
    </div>
    <h1>손실 없는 투자 원칙<br><span class="gold-txt">VIP (포커스)</span></h1>
</header>

<div class="container">
    <div class="benefit-row">
        <div class="benefit-item"><span>초기 매입금 지원</span><b>20% 즉시지급</b></div>
        <div style="width:1px; background:rgba(251,191,36,0.3);"></div>
        <div class="benefit-item"><span>해외선물 수수료</span><b>$2.0 최저가</b></div>
    </div>

    <div class="info-card">
        <div class="point" style="margin-bottom:12px;">상방/하방 구애받지 않는 양방향 타점 공유</div>
        <div class="point" style="margin-bottom:12px;">해외선물 리스크 헷지 시스템 가동</div>
        <div class="point" style="margin-bottom:12px;">검증된 포커스만의 독보적 시장 분석 노하우</div>
        <div class="point" style="margin-bottom:12px;">초보자도 수익 낼 수 있는 1:1 맞춤형 무료 교육</div>
        <div class="point">전담 전문가 배정 및 실시간 리딩 서비스</div>
    </div>

    <div class="form-section">
        <strong style="font-size: 22px; color: #fff; margin-bottom: 20px; display: block;">▼ 실시간 VIP 컨설팅 신청 ▼</strong>
        
        <div class="form-wrap">
            <iframe src="https://naver.me/50BAV2eP" frameborder="0">로드 중...</iframe>
        </div>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 20px;">정보 입력 즉시 전문가가 연락드립니다.</p>
    </div>

    <div class="footer-counter">
        <p style="color: #64748b; font-size: 12px; margin-bottom: 12px; letter-spacing: 2px;">REAL-TIME TRAFFIC</p>
        <div class="counter-box">
            <span style="color: #fbbf24; font-size: 20px; font-weight: bold; letter-spacing: 2px;">
                <span style="font-size: 14px; margin-right: 8px; vertical-align: middle; animation: blink 1s infinite;">● LIVE</span> 
                <span id="visit-number">1,053</span>
            </span>
        </div>
    </div>
</div>

<script>
    function updateCounter() {
        let count = parseInt(localStorage.getItem('focus_total_count')) || 1053;
        if (!localStorage.getItem('focus_real_visit')) {
            count += 1;
            localStorage.setItem('focus_total_count', count);
            localStorage.setItem('focus_real_visit', Date.now());
        }
        document.getElementById('visit-number').innerText = count.toLocaleString();
    }
    updateCounter();
</script>

@keyframes blink { 50% { opacity: 0; } }
</body>
</html>
